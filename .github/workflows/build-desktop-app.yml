# 天空日記觀察站：在 GitHub 的 Windows 與 macOS 機器上打包安裝檔（PyInstaller）。
# 推一個 app-v* 標籤（例如 app-v1.0.0）就會自動建置，並把三個壓縮檔放上 GitHub Releases。
name: build-desktop-app
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SkyDiary-Windows
          - os: macos-15          # Apple 晶片（M1 以後）
            artifact: SkyDiary-macOS-AppleSilicon
          - os: macos-15-intel    # Intel Mac
            artifact: SkyDiary-macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件
        run: python -m pip install --upgrade pip "numpy==2.4.*" "pillow==11.*" pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10 imageio-ffmpeg==0.6.0
      - name: 打包
        working-directory: app
        shell: bash
        run: |
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p ffmpeg_bin
          SEP=":"; EXE=""; if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; EXE=".exe"; fi
          cp "$FF" "ffmpeg_bin/ffmpeg${EXE}"; chmod +x "ffmpeg_bin/ffmpeg${EXE}"   # 改名成 ffmpeg，程式才找得到
          python -m PyInstaller --noconfirm --clean --name "SkyDiary" --windowed \
            --add-data "ui.html${SEP}." --add-binary "ffmpeg_bin/ffmpeg${EXE}${SEP}ffmpeg_bin" \
            --hidden-import skycam_tool --hidden-import models skycam_app.py
      - name: 冒煙測試（真的啟動打包好的程式並查狀態）
        working-directory: app/dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=./SkyDiary/SkyDiary.exe; else BIN=./SkyDiary.app/Contents/MacOS/SkyDiary; fi
          "$BIN" --no-browser --port 18765 --data ./smoke > smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -s --max-time 5 http://127.0.0.1:18765/api/state > state.json && grep -q '"version"' state.json; then ok=1; break; fi
            sleep 2
          done
          cat state.json || true; echo; tail -20 smoke.log || true; tail -20 ./smoke/skydiary.log 2>/dev/null || true
          if [ $ok = 1 ]; then curl -s --max-time 10 "http://127.0.0.1:18765/api/moon/calendar?from=20261201&days=3" > moon.json && grep -q '"ok": *true' moon.json || { echo "月相模型沒包進去"; cat moon.json; ok=0; }; fi
          if [ $ok = 1 ]; then curl -s --max-time 5 -o home.html http://127.0.0.1:18765/ && grep -q "天空日記觀察站" home.html || ok=0; fi
          curl -s --max-time 5 -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:18765/api/quit || true
          sleep 2
          kill $PID 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM SkyDiary.exe 2>/dev/null || true; fi
          rm -rf ./smoke smoke.log state.json home.html moon.json
          [ $ok = 1 ]
      - name: 壓縮
        working-directory: app/dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../${{ matrix.artifact }}.zip SkyDiary; else ditto -c -k --keepParent SkyDiary.app ../../${{ matrix.artifact }}.zip; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: 天空日記觀察站 ${{ github.ref_name }}
          body: |
            學生用的桌面程式：同步相機照片、看相簿；觀察主題有夕陽、植物生長、月亮與月相、雲量與天氣、影子與太陽高度，各附科學模型對照；「即時畫面」可同時看多台相機；（同意後）每天分享一份夕陽摘要給老師。
            下載對應的壓縮檔，解壓縮後打開 SkyDiary。第一次打開時系統可能會跳出警告，處理方法見 https://henrychao521.github.io/skycam/#app
